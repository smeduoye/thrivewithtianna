# Production compose — pull images from ghcr.io (AWS EC2, Oracle VM, or any Docker host).
# Images are multi-arch (linux/amd64 + linux/arm64) so they run on x86 or Graviton/A1.
# Copy with .env to server; see infrastructure/oracle-always-free-runbook.md
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: thrivewithtianna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thrive}
      POSTGRES_USER: ${POSTGRES_USER:-thrive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thrive} -d ${POSTGRES_DB:-thrive}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - thrive

  api:
    image: ${API_IMAGE:-ghcr.io/smeduoye/thrivewithtianna-api:latest}
    container_name: thrivewithtianna-api
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-thrive}
      DATABASE_USERNAME: ${POSTGRES_USER:-thrive}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://app.thrivewithtianna.com}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xmx1024m}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET /actuator/health HTTP/1.0\r\n\r\n" >&3; grep -q UP <&3'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - thrive

  web:
    image: ${WEB_IMAGE:-ghcr.io/smeduoye/thrivewithtianna-web:latest}
    container_name: thrivewithtianna-web
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - thrive

  caddy:
    image: caddy:2-alpine
    container_name: thrivewithtianna-caddy
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-app.thrivewithtianna.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - thrive

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  thrive:
    driver: bridge
