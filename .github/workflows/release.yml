name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test
        working-directory: portal/backend
        run: mvn -B verify

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/frontend/package-lock.json
      - name: Install dependencies
        working-directory: portal/frontend
        run: npm ci
      - name: Type-check / lint
        working-directory: portal/frontend
        run: npm run lint
      - name: Test
        working-directory: portal/frontend
        run: npm test

  publish:
    name: Build & push images
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: ./portal/backend
          - name: web
            context: ./portal/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        if: matrix.name == 'api'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Set up Node 22
        if: matrix.name == 'web'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/frontend/package-lock.json

      - name: Build backend JAR
        if: matrix.name == 'api'
        working-directory: portal/backend
        run: mvn -B package -DskipTests

      - name: Build frontend dist
        if: matrix.name == 'web'
        working-directory: portal/frontend
        run: |
          npm ci
          npm run build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push (ARM64 for Oracle A1)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
