services:
  postgres:
    image: postgres:16-alpine
    container_name: thrivewithtianna-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thrive}
      POSTGRES_USER: ${POSTGRES_USER:-thrive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thrive}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thrive} -d ${POSTGRES_DB:-thrive}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - thrive

  api:
    build:
      context: ./backend
    container_name: thrivewithtianna-api
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-thrive}
      DATABASE_USERNAME: ${POSTGRES_USER:-thrive}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-thrive}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8081}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET /actuator/health HTTP/1.0\r\n\r\n" >&3; grep -q UP <&3'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - thrive

  web:
    build:
      context: ./frontend
    container_name: thrivewithtianna-web
    ports:
      - "8081:80"
    depends_on:
      - api
    networks:
      - thrive

volumes:
  postgres_data:

networks:
  thrive:
    driver: bridge
