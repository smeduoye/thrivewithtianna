spring:
  application:
    name: thrive-with-tianna
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/thrive}
    username: ${DATABASE_USERNAME:thrive}
    password: ${DATABASE_PASSWORD:thrive}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

app:
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:8081},http://localhost:5173
  jwt:
    secret: ${JWT_SECRET:change-me-in-production}
    expiration: 7d

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.thrivewithtianna: INFO
